<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview Result — InterviewAI</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  .result-hero { text-align:center; padding: 10px 0 28px; }
  .result-hero .big-score { font-family: var(--font-heading); font-size: 3.4rem; font-weight:700; color: var(--accent); }
  .score-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin: 24px 0; }
  .qr-item { border:1px solid var(--border); border-radius: var(--radius-lg); padding:20px; margin-bottom:14px; }
  .qr-item .qr-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; }
  .qr-item .qr-question { font-weight:600; max-width:75%; }
  .qr-answer { background: var(--paper); border-radius: var(--radius-md); padding: 12px 14px; font-size:0.88rem; color: var(--text-muted); margin-bottom:10px; }
  @media (max-width: 700px) { .score-grid { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>

<div class="app-shell" id="app-shell-root"></div>

<template id="result-content-template">
  <div id="result-loading" class="loading-block"><span class="spinner"></span> Loading your results…</div>

  <div id="result-body" class="hidden">
    <div class="card result-hero">
      <p class="text-muted mb-8" style="margin:0;">Interview Completed 🎉</p>
      <div class="big-score"><span id="overall-score">0</span>%</div>
      <p class="text-muted" id="result-meta"></p>
    </div>

    <div class="score-grid">
      <div class="stat-card"><div class="stat-label">Technical Knowledge</div><div class="stat-value" id="score-technical">0%</div></div>
      <div class="stat-card"><div class="stat-label">Communication</div><div class="stat-value" id="score-communication">0%</div></div>
      <div class="stat-card"><div class="stat-label">Relevance</div><div class="stat-value" id="score-relevance">0%</div></div>
      <div class="stat-card"><div class="stat-label">Clarity</div><div class="stat-value" id="score-clarity">0%</div></div>
    </div>

    <div class="grid-2 mb-24">
      <div class="card">
        <h4><i class="fa-solid fa-star" style="color:var(--teal);"></i> Strong Areas</h4>
        <ul id="strong-areas-list"></ul>
      </div>
      <div class="card">
        <h4><i class="fa-solid fa-triangle-exclamation" style="color:var(--amber);"></i> Areas to Improve</h4>
        <ul id="weak-areas-list"></ul>
      </div>
    </div>

    <div class="card mb-24">
      <h4><i class="fa-solid fa-lightbulb" style="color:var(--accent);"></i> AI Recommendations</h4>
      <ul id="recommendations-list"></ul>
    </div>

    <h3 class="mb-16">Question Review</h3>
    <div id="question-review-wrap"></div>

    <div class="flex gap-12 mt-24">
      <a href="interview.html" class="btn btn-primary btn-lg">Retry Interview</a>
      <a href="dashboard.html" class="btn btn-secondary btn-lg">Back to Dashboard</a>
    </div>
  </div>
</template>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/interview-result.js"></script>
</body>
</html>
