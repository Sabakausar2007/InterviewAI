<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCQ Practice — InterviewAI</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  .category-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; margin-top: 18px; }
  .category-card { border:1px solid var(--border); border-radius: var(--radius-lg); padding:20px; cursor:pointer; background:var(--surface); transition: all 0.15s ease; }
  .category-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .category-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .category-card .cat-icon { width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin-bottom:12px; }
  .category-card .cat-count { font-size:0.78rem; color:var(--text-faint); }

  .quiz-stage { max-width: 760px; margin:0 auto; }
  .option-btn { display:block; width:100%; text-align:left; padding:14px 18px; border:1.5px solid var(--border-strong); border-radius: var(--radius-md); background:var(--surface); margin-bottom:10px; cursor:pointer; font-size:0.95rem; transition: all 0.12s ease; }
  .option-btn:hover { border-color: var(--accent); }
  .option-btn.selected { border-color: var(--accent); background: var(--accent-soft); font-weight:600; }
  .option-btn .opt-letter { display:inline-flex; width:24px;height:24px;border-radius:50%;background:var(--paper); align-items:center; justify-content:center; font-size:0.78rem; font-weight:700; margin-right:10px; color:var(--text-muted); }
  .option-btn.selected .opt-letter { background:var(--accent); color:#fff; }
  .quiz-nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="app-shell" id="app-shell-root"></div>

<template id="mcq-content-template">

  <!-- ============ SETUP PANEL ============ -->
  <div id="panel-mcq-setup">
    <div id="category-select-view">
      <h3 class="mb-8">Choose a category</h3>
      <p class="text-muted">Pick a topic, then set your difficulty and question count.</p>
      <div class="category-grid" id="category-grid">
        <div class="loading-block" style="grid-column:1/-1;"><span class="spinner"></span> Loading categories…</div>
      </div>
    </div>

    <div id="quiz-options-view" class="card hidden mt-24" style="max-width:520px;">
      <button class="btn btn-ghost btn-sm mb-16" id="back-to-categories"><i class="fa-solid fa-arrow-left"></i> Change category</button>
      <h3 id="selected-category-title" style="margin-bottom:20px;"></h3>

      <div class="field">
        <label>Difficulty</label>
        <div class="radio-cards" id="mcq-difficulty-options">
          <div class="radio-card" data-value="Easy">Easy</div>
          <div class="radio-card" data-value="Medium">Medium</div>
          <div class="radio-card" data-value="Hard">Hard</div>
        </div>
      </div>
      <div class="field">
        <label>Number of Questions</label>
        <div class="radio-cards" id="mcq-count-options">
          <div class="radio-card" data-value="10">10</div>
          <div class="radio-card" data-value="20">20</div>
          <div class="radio-card" data-value="30">30</div>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block mt-16" id="start-quiz-btn">Start Quiz</button>
    </div>
  </div>

  <!-- ============ QUIZ PANEL ============ -->
  <div id="panel-mcq-quiz" class="quiz-stage hidden">
    <div class="flex-between mb-8">
      <span class="text-muted" style="font-size:0.85rem;font-weight:600;" id="mcq-counter">Question 1 / 10</span>
      <span class="timer-pill" id="mcq-timer"><i class="fa-regular fa-clock"></i> 00:00</span>
    </div>
    <div class="progress-track mb-24"><div class="progress-fill teal" id="mcq-progress" style="width:0%;"></div></div>

    <div class="card mb-20">
      <h3 id="mcq-question-text" style="margin-bottom:22px;"></h3>
      <div id="mcq-options-wrap"></div>
    </div>

    <div class="quiz-nav">
      <button class="btn btn-secondary" id="mcq-prev-btn"><i class="fa-solid fa-arrow-left"></i> Previous</button>
      <div class="flex gap-10">
        <button class="btn btn-primary hidden" id="mcq-next-btn">Next <i class="fa-solid fa-arrow-right"></i></button>
        <button class="btn btn-primary hidden" id="mcq-submit-btn">Submit Quiz</button>
      </div>
    </div>
  </div>

</template>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/mcq.js"></script>
</body>
</html>
